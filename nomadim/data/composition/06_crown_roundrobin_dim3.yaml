meta:
  notes: "NOT COMPOSABLE (dim 3). Round-robin avoidance = the standard example S3 (the crown). Each producer a_i (vertices 0,1,2) notifies every consumer EXCEPT its own counterpart b_i (frontier F a_i b_j = i <> j). The three concurrent pairs (a0,b0),(a1,b1),(a2,b2) cyclically cross and form an alternating cycle no two linear orders can realize, so connecting these two dim-2 groups RAISES the dimension to 3. This is the canonical crossing frontier -- the only way to break dim-2. (= nomadim/data/poset_s3.yaml.) Coq: crown3_dim_ge_3 / crown3_dim_ge_3_closed (FrontierCompose.v)."
  dimension: 3
