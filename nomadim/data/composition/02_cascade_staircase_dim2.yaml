poset:
  n_vertices: 6
  edges:
    - [0, 3]
    - [0, 4]
    - [0, 5]
    - [1, 4]
    - [1, 5]
    - [2, 5]
meta:
  notes: "COMPOSABLE (dim 2). Cascade / staircase pipeline. Producer a_i notifies consumers b_i, b_{i+1}, ... (frontier F a_i b_j = i <= j). Vertices 0,1,2 = a0,a1,a2; 3,4,5 = b0,b1,b2. The message rows are NESTED -- row(a0) {b0,b1,b2} contains row(a1) {b1,b2} contains row(a2) {b2} -- so no two messages cross. This is the canonical non-crossing (Ferrers/threshold) frontier. dim = 2. Coq: this is the formalized Fstair (threshold_dim_le2 with phi=psi=index; stair_dim_le2 in FrontierComposeExamples.v)."
  dimension: 2
